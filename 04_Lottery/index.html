<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>隨機抽籤點名工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft JhengHei', Arial, sans-serif;
            background: linear-gradient(135deg, #ff9a56 0%, #ff6b6b 50%, #feca57 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            max-width: 600px;
            width: 100%;
        }

        .title {
            font-size: 42px;
            color: #e74c3c;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .name-input-area {
            margin-bottom: 30px;
        }

        .name-input-area label {
            display: block;
            font-size: 16px;
            color: #666;
            margin-bottom: 10px;
        }

        .name-input {
            width: 100%;
            height: 100px;
            padding: 15px;
            font-size: 16px;
            border: 3px solid #f39c12;
            border-radius: 15px;
            resize: none;
            outline: none;
            transition: border-color 0.3s ease;
        }

        .name-input:focus {
            border-color: #e74c3c;
        }

        .update-btn {
            font-size: 14px;
            font-weight: bold;
            padding: 10px 20px;
            background: linear-gradient(135deg, #f39c12, #e67e22);
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s ease;
        }

        .update-btn:hover {
            background: linear-gradient(135deg, #e38c02, #d67012);
            transform: translateY(-2px);
        }

        .lucky-btn {
            font-size: 28px;
            font-weight: bold;
            padding: 20px 50px;
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(231, 76, 60, 0.4);
            transition: all 0.3s ease;
            margin-bottom: 30px;
        }

        .lucky-btn:hover {
            background: linear-gradient(135deg, #d73c2c, #b0291b);
            box-shadow: 0 15px 40px rgba(231, 76, 60, 0.5);
            transform: translateY(-3px);
        }

        .lucky-btn:active {
            transform: translateY(0);
        }

        .lucky-btn:disabled {
            background: #ccc;
            box-shadow: none;
            cursor: not-allowed;
        }

        .result-area {
            min-height: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #fff9c4, #fff3e0);
            border-radius: 20px;
            padding: 20px;
        }

        .result-name {
            font-size: 72px;
            font-weight: bold;
            color: #e74c3c;
            opacity: 0;
            transform: scale(0);
        }

        .result-name.show {
            animation: bounceIn 0.8s ease forwards;
        }

        @keyframes bounceIn {
            0% {
                opacity: 0;
                transform: scale(0) rotate(-10deg);
            }
            50% {
                opacity: 1;
                transform: scale(1.2) rotate(5deg);
            }
            70% {
                transform: scale(0.9) rotate(-3deg);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        .confetti {
            position: fixed;
            width: 15px;
            height: 15px;
            background: #f39c12;
            pointer-events: none;
            animation: confettiFall 3s ease-out forwards;
        }

        @keyframes confettiFall {
            0% {
                opacity: 1;
                transform: translateY(0) rotate(0deg);
            }
            100% {
                opacity: 0;
                transform: translateY(100vh) rotate(720deg);
            }
        }

        .hint {
            margin-top: 20px;
            font-size: 14px;
            color: #999;
        }

        .name-input-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .name-input-header label {
            display: block;
            font-size: 16px;
            color: #666;
        }

        .remaining-count {
            background: linear-gradient(135deg, #ff6b6b, #e74c3c);
            color: white;
            padding: 5px 15px;
            border-radius: 15px;
            font-size: 14px;
            font-weight: bold;
        }

        .options-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
        }

        .no-repeat-checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .no-repeat-checkbox input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .no-repeat-checkbox span {
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">隨機抽籤點名工具</h1>
        
        <div class="name-input-area">
            <div class="name-input-header">
                <label>抽籤學生名單庫</label>
                <span class="remaining-count">剩餘 <span id="nameCount">6</span> 人</span>
            </div>
            <textarea class="name-input" id="nameInput">張小明, 林大華, 陳美麗, 王好強, 李茱莉, 黃宇宙</textarea>
            <div class="options-row">
                <button class="update-btn" onclick="updateNameList()">更新名單</button>
                <label class="no-repeat-checkbox">
                    <input type="checkbox" id="noRepeat">
                    <span>不重複抽籤（抽中後移除）</span>
                </label>
            </div>
        </div>

        <button class="lucky-btn" id="luckyBtn" onclick="drawLucky()">
            抽出幸運兒
        </button>

        <div class="result-area">
            <div class="result-name" id="resultName"></div>
        </div>
    </div>

    <script>
        let names = ['張小明', '林大華', '陳美麗', '王好強', '李茱莉', '黃宇宙'];
        let isDrawing = false;

        function updateNameList() {
            const input = document.getElementById('nameInput').value;
            const parsedNames = input.split(/[,，\n]+/)
                .map(name => name.trim())
                .filter(name => name.length > 0);
            
            if (parsedNames.length > 0) {
                names = parsedNames;
                document.getElementById('nameCount').textContent = names.length;
                document.getElementById('luckyBtn').disabled = false;
                alert('名單已更新！共 ' + names.length + ' 人');
            } else {
                alert('請輸入至少一個名字');
            }
        }

        function drawLucky() {
            if (isDrawing || names.length === 0) return;
            
            isDrawing = true;
            const luckyBtn = document.getElementById('luckyBtn');
            const resultName = document.getElementById('resultName');
            const noRepeat = document.getElementById('noRepeat').checked;
            
            luckyBtn.disabled = true;
            resultName.classList.remove('show');
            
            let count = 0;
            const totalCycles = 20;
            const interval = setInterval(() => {
                const randomIndex = Math.floor(Math.random() * names.length);
                resultName.textContent = names[randomIndex];
                resultName.style.opacity = '1';
                resultName.style.transform = 'scale(1)';
                count++;
                
                if (count >= totalCycles) {
                    clearInterval(interval);
                    const finalIndex = Math.floor(Math.random() * names.length);
                    const selectedName = names[finalIndex];
                    resultName.textContent = selectedName;
                    resultName.classList.add('show');
                    createConfetti();
                    playCelebration();
                    
                    if (noRepeat) {
                        names.splice(finalIndex, 1);
                        document.getElementById('nameCount').textContent = names.length;
                        document.getElementById('nameInput').value = names.join(', ');
                        
                        if (names.length === 0) {
                            luckyBtn.disabled = true;
                            setTimeout(() => {
                                alert('所有名字都已抽完！');
                            }, 1000);
                        }
                    }
                    
                    isDrawing = false;
                    if (names.length > 0) {
                        luckyBtn.disabled = false;
                    }
                }
            }, 100);
        }

        function createConfetti() {
            const colors = ['#e74c3c', '#f39c12', '#2ecc71', '#3498db', '#9b59b6', '#f1c40f'];
            
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + 'vw';
                    confetti.style.top = '-20px';
                    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                    document.body.appendChild(confetti);
                    
                    setTimeout(() => confetti.remove(), 3000);
                }, i * 50);
            }
        }

        function playCelebration() {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            
            // Play a cheerful celebration melody
            const notes = [
                { freq: 523.25, duration: 0.15 }, // C5
                { freq: 659.25, duration: 0.15 }, // E5
                { freq: 783.99, duration: 0.15 }, // G5
                { freq: 1046.50, duration: 0.3 }, // C6
            ];
            
            let currentTime = audioContext.currentTime;
            
            notes.forEach((note, index) => {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.value = note.freq;
                oscillator.type = 'sine';
                
                gainNode.gain.setValueAtTime(0.3, currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, currentTime + note.duration);
                
                oscillator.start(currentTime);
                oscillator.stop(currentTime + note.duration);
                
                currentTime += note.duration;
            });

            // Add a fanfare-like sound after the melody
            setTimeout(() => {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.value = 880;
                oscillator.type = 'triangle';
                
                gainNode.gain.setValueAtTime(0.4, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.5);
            }, 800);
        }

        document.getElementById('nameInput').value = names.join(', ');
    </script>
</body>
</html>
