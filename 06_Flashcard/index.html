<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知識閃卡 Flashcard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft JhengHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            text-align: center;
            max-width: 600px;
            width: 100%;
        }

        .title {
            font-size: 42px;
            color: white;
            margin-bottom: 40px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .card-container {
            perspective: 1000px;
            margin-bottom: 40px;
        }

        .card {
            width: 100%;
            height: 350px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s ease;
            cursor: pointer;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 25px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .card-front {
            background: linear-gradient(135deg, #ffffff 0%, #f5f5f5 100%);
        }

        .card-back {
            background: linear-gradient(135deg, #ff9a56 0%, #ff6b6b 100%);
            transform: rotateY(180deg);
        }

        .card-label {
            font-size: 16px;
            color: #999;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .card-content {
            font-size: 48px;
            font-weight: bold;
            color: #333;
            word-break: break-word;
        }

        .card-back .card-label {
            color: rgba(255, 255, 255, 0.8);
        }

        .card-back .card-content {
            color: white;
            font-size: 36px;
        }

        .card-hint {
            margin-top: 20px;
            font-size: 14px;
            color: #999;
        }

        .card-back .card-hint {
            color: rgba(255, 255, 255, 0.7);
        }

        .speak-btn {
            margin-top: 20px;
            font-size: 16px;
            font-weight: bold;
            padding: 10px 25px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .speak-btn:hover {
            transform: scale(1.05);
        }

        .speak-btn-front {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
        }

        .speak-btn-back {
            background: rgba(255, 255, 255, 0.3);
            color: white;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .control-btn {
            font-size: 14px;
            font-weight: bold;
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .control-btn:hover {
            transform: translateY(-2px);
        }

        .shuffle-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
        }

        .shuffle-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .navigation {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .nav-btn {
            font-size: 18px;
            font-weight: bold;
            padding: 15px 40px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .nav-btn:hover {
            transform: translateY(-3px);
        }

        .nav-btn:active {
            transform: translateY(0);
        }

        .prev-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
        }

        .prev-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .next-btn {
            background: white;
            color: #667eea;
        }

        .next-btn:hover {
            background: #f0f0f0;
        }

        .progress {
            margin-top: 30px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 16px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            margin-top: 15px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: white;
            border-radius: 4px;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">中學英文單字閃卡</h1>
        
        <div class="controls">
            <button class="control-btn shuffle-btn" onclick="shuffleCards()">隨機排序</button>
        </div>
        
        <div class="card-container">
            <div class="card" id="flashcard" onclick="flipCard()">
                <div class="card-face card-front">
                    <div class="card-label">英文</div>
                    <div class="card-content" id="frontContent">Apple</div>
                    <button class="speak-btn speak-btn-front" onclick="event.stopPropagation(); speakEnglish()">🔊 聽發音</button>
                    <div class="card-hint">點擊翻轉看中文</div>
                </div>
                <div class="card-face card-back">
                    <div class="card-label">中文</div>
                    <div class="card-content" id="backContent">蘋果</div>
                    <div class="card-hint">點擊翻回</div>
                </div>
            </div>
        </div>

        <div class="navigation">
            <button class="nav-btn prev-btn" onclick="prevCard()">上一題</button>
            <button class="nav-btn next-btn" onclick="nextCard()">下一題</button>
        </div>

        <div class="progress">
            <span id="progressText">1 / 100</span>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>
    </div>

    <script>
        const flashcards = [
            { front: 'abandon', back: '放棄' },
            { front: 'ability', back: '能力' },
            { front: 'absent', back: '缺席的' },
            { front: 'absorb', back: '吸收' },
            { front: 'abstract', back: '抽象的' },
            { front: 'academic', back: '學術的' },
            { front: 'accept', back: '接受' },
            { front: 'access', back: '通道；進入' },
            { front: 'accomplish', back: '完成；實現' },
            { front: 'account', back: '帳戶；描述' },
            { front: 'accurate', back: '準確的' },
            { front: 'achieve', back: '達成；實現' },
            { front: 'acid', back: '酸' },
            { front: 'acknowledge', back: '承認；感謝' },
            { front: 'acquire', back: '獲得；學到' },
            { front: 'adapt', back: '適應；改編' },
            { front: 'addict', back: '上癮的人' },
            { front: 'adequate', back: '足夠的' },
            { front: 'adjust', back: '調整；適應' },
            { front: 'administration', back: '管理；行政' },
            { front: 'admire', back: '欣賞；欽佩' },
            { front: 'admit', back: '承認；准許進入' },
            { front: 'adolescent', back: '青少年' },
            { front: 'adopt', back: '採用；收養' },
            { front: 'adult', back: '成人' },
            { front: 'advance', back: '前進；進步' },
            { front: 'advantage', back: '優勢' },
            { front: 'adventure', back: '冒險' },
            { front: 'advertise', back: '登廣告' },
            { front: 'affect', back: '影響' },
            { front: 'afford', back: '負擔得起' },
            { front: 'agenda', back: '議程' },
            { front: 'aggressive', back: '有進取心的；侵略的' },
            { front: 'agony', back: '痛苦' },
            { front: 'agree', back: '同意' },
            { front: 'agriculture', back: '農業' },
            { front: 'aim', back: '目標；瞄準' },
            { front: 'alarm', back: '警報' },
            { front: 'album', back: '相簿；專輯' },
            { front: 'alcohol', back: '酒精' },
            { front: 'alert', back: '警覺的' },
            { front: 'alien', back: '外星人；外國的' },
            { front: 'allocate', back: '分配' },
            { front: 'allow', back: '允許' },
            { front: 'alter', back: '改變' },
            { front: 'alternative', back: '替代的' },
            { front: 'amateur', back: '業餘的' },
            { front: 'amaze', back: '使驚奇' },
            { front: 'ambition', back: '雄心' },
            { front: 'ambulance', back: '救護車' },
            { front: 'among', back: '在...之中' },
            { front: 'amount', back: '總量' },
            { front: 'analyze', back: '分析' },
            { front: 'ancestor', back: '祖先' },
            { front: 'ancient', back: '古老的' },
            { front: 'anger', back: '憤怒' },
            { front: 'angle', back: '角度' },
            { front: 'announce', back: '宣布' },
            { front: 'annual', back: '每年的' },
            { front: 'anonymous', back: '匿名的' },
            { front: 'anxiety', back: '焦慮' },
            { front: 'apart', back: '分開地' },
            { front: 'apartment', back: '公寓' },
            { front: 'apologize', back: '道歉' },
            { front: 'apparent', back: '顯然的' },
            { front: 'appeal', back: '呼吁；吸引力' },
            { front: 'appear', back: '出現' },
            { front: 'appetite', back: '食慾' },
            { front: 'applause', back: '掌聲' },
            { front: 'appliance', back: '電器' },
            { front: 'applicant', back: '申請人' },
            { front: 'application', back: '申請；應用' },
            { front: 'apply', back: '申請；應用' },
            { front: 'appoint', back: '任命' },
            { front: 'appreciate', back: '感激；欣賞' },
            { front: 'approach', back: '接近；方法' },
            { front: 'appropriate', back: '適當的' },
            { front: 'approve', back: '批准' },
            { front: 'approximate', back: '大約的' },
            { front: 'architect', back: '建築師' },
            { front: 'area', back: '地區；領域' },
            { front: 'argue', back: '爭論' },
            { front: 'arise', back: '出現；產生' },
            { front: 'arithmetic', back: '算術' },
            { front: 'arm', back: '手臂；武器' },
            { front: 'army', back: '軍隊' },
            { front: 'arrange', back: '安排' },
            { front: 'arrest', back: '逮捕' },
            { front: 'arrival', back: '到達' },
            { front: 'article', back: '文章；物品' },
            { front: 'artificial', back: '人造的' },
            { front: 'artist', back: '藝術家' },
            { front: 'ashamed', back: '羞愧的' },
            { front: 'aspect', back: '方面' },
            { front: 'assemble', back: '組裝；集合' },
            { front: 'assess', back: '評估' },
            { front: 'assign', back: '分配' },
            { front: 'assist', back: '協助' },
            { front: 'associate', back: '聯想；同事' },
            { front: 'assume', back: '假設' },
            { front: 'assure', back: '保證' },
            { front: 'atmosphere', back: '大氣層；氣氛' },
            { front: 'attach', back: '附上' },
            { front: 'attack', back: '攻擊' },
            { front: 'attain', back: '達到' },
            { front: 'attempt', back: '嘗試' },
            { front: 'attend', back: '參加' },
            { front: 'attitude', back: '態度' },
            { front: 'attract', back: '吸引' },
            { front: 'audience', back: '觀眾' },
            { front: 'authority', back: '權威；當局' },
            { front: 'automatic', back: '自動的' }
        ];

        let currentIndex = 0;
        let isFlipped = false;
        let shuffledCards = [...flashcards];

        function updateCard() {
            const card = document.getElementById('flashcard');
            const frontContent = document.getElementById('frontContent');
            const backContent = document.getElementById('backContent');
            const progressText = document.getElementById('progressText');
            const progressFill = document.getElementById('progressFill');

            frontContent.textContent = shuffledCards[currentIndex].front;
            backContent.textContent = shuffledCards[currentIndex].back;
            progressText.textContent = `${currentIndex + 1} / ${shuffledCards.length}`;
            
            const progressPercent = ((currentIndex + 1) / shuffledCards.length) * 100;
            progressFill.style.width = `${progressPercent}%`;

            card.classList.remove('flipped');
            isFlipped = false;
        }

        function flipCard() {
            const card = document.getElementById('flashcard');
            isFlipped = !isFlipped;
            
            if (isFlipped) {
                card.classList.add('flipped');
            } else {
                card.classList.remove('flipped');
            }
        }

        function prevCard() {
            if (currentIndex > 0) {
                currentIndex--;
                updateCard();
            }
        }

        function nextCard() {
            if (currentIndex < shuffledCards.length - 1) {
                currentIndex++;
                updateCard();
            }
        }

        function speakEnglish() {
            const text = shuffledCards[currentIndex].front;
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.8;
            utterance.pitch = 1;
            speechSynthesis.speak(utterance);
        }

        function shuffleCards() {
            for (let i = shuffledCards.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffledCards[i], shuffledCards[j]] = [shuffledCards[j], shuffledCards[i]];
            }
            currentIndex = 0;
            updateCard();
        }

        updateCard();
    </script>
</body>
</html>
