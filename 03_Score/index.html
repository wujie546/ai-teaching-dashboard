<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>課堂小組計分板</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft JhengHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 30px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 48px;
            color: white;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.3);
            margin-bottom: 10px;
        }

        .header p {
            color: rgba(255, 255, 255, 0.8);
            font-size: 18px;
        }

        .global-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
        }

        .global-btn {
            font-size: 16px;
            font-weight: bold;
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .global-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-2px);
        }

        .global-btn:active {
            transform: translateY(0);
        }

        .global-btn.reward {
            background: linear-gradient(135deg, #f39c12, #e67e22);
            border-color: #f39c12;
        }

        .global-btn.reward:hover {
            background: linear-gradient(135deg, #e38c02, #d67012);
        }

        .scoreboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .group-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .group-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 8px;
            background: linear-gradient(90deg, var(--group-color), var(--group-color-light));
        }

        .group-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .group-card:nth-child(1) { --group-color: #ff6b6b; --group-color-light: #ffa5a5; }
        .group-card:nth-child(2) { --group-color: #4ecdc4; --group-color-light: #a8e6cf; }
        .group-card:nth-child(3) { --group-color: #ffe66d; --group-color-light: #fff3b0; }
        .group-card:nth-child(4) { --group-color: #95e1d3; --group-color-light: #c8f0ea; }
        .group-card:nth-child(5) { --group-color: #dda0dd; --group-color-light: #e8c8e8; }
        .group-card:nth-child(6) { --group-color: #87ceeb; --group-color-light: #b8e0f0; }

        .group-name {
            font-size: 28px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #eee;
        }

        .score-display {
            font-size: 80px;
            font-weight: bold;
            color: #2c3e50;
            margin: 20px 0;
            transition: all 0.3s ease;
        }

        .score-display.highest {
            color: #e74c3c;
            animation: pulse 1s infinite;
            text-shadow: 0 0 20px rgba(231, 76, 60, 0.5);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }

        .btn {
            font-size: 18px;
            font-weight: bold;
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-add {
            background: linear-gradient(135deg, #00b894, #00cec9);
            color: white;
            box-shadow: 0 5px 15px rgba(0, 184, 148, 0.4);
        }

        .btn-add:hover {
            background: linear-gradient(135deg, #00a884, #00bfb9);
            box-shadow: 0 8px 20px rgba(0, 184, 148, 0.5);
        }

        .btn-subtract {
            background: linear-gradient(135deg, #e17055, #d63031);
            color: white;
            box-shadow: 0 5px 15px rgba(214, 48, 49, 0.4);
        }

        .btn-subtract:hover {
            background: linear-gradient(135deg, #d16045, #c62021);
            box-shadow: 0 8px 20px rgba(214, 48, 49, 0.5);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>課堂小組計分板</h1>
        <p>為各組加油打氣，看誰能獲得最高分！</p>
    </div>

    <div class="global-buttons">
        <button class="global-btn" onclick="resetAll()">重置全部分數</button>
        <button class="global-btn reward" onclick="rewardAll()">全班獎勵 +1</button>
    </div>

    <div class="scoreboard">
        <div class="group-card" data-group="1">
            <div class="group-name">第一組</div>
            <div class="score-display" id="score1">0</div>
            <div class="buttons">
                <button class="btn btn-add" onclick="updateScore(1, 1)">+1 分</button>
                <button class="btn btn-subtract" onclick="updateScore(1, -1)">-1 分</button>
            </div>
        </div>

        <div class="group-card" data-group="2">
            <div class="group-name">第二組</div>
            <div class="score-display" id="score2">0</div>
            <div class="buttons">
                <button class="btn btn-add" onclick="updateScore(2, 1)">+1 分</button>
                <button class="btn btn-subtract" onclick="updateScore(2, -1)">-1 分</button>
            </div>
        </div>

        <div class="group-card" data-group="3">
            <div class="group-name">第三組</div>
            <div class="score-display" id="score3">0</div>
            <div class="buttons">
                <button class="btn btn-add" onclick="updateScore(3, 1)">+1 分</button>
                <button class="btn btn-subtract" onclick="updateScore(3, -1)">-1 分</button>
            </div>
        </div>

        <div class="group-card" data-group="4">
            <div class="group-name">第四組</div>
            <div class="score-display" id="score4">0</div>
            <div class="buttons">
                <button class="btn btn-add" onclick="updateScore(4, 1)">+1 分</button>
                <button class="btn btn-subtract" onclick="updateScore(4, -1)">-1 分</button>
            </div>
        </div>

        <div class="group-card" data-group="5">
            <div class="group-name">第五組</div>
            <div class="score-display" id="score5">0</div>
            <div class="buttons">
                <button class="btn btn-add" onclick="updateScore(5, 1)">+1 分</button>
                <button class="btn btn-subtract" onclick="updateScore(5, -1)">-1 分</button>
            </div>
        </div>

        <div class="group-card" data-group="6">
            <div class="group-name">第六組</div>
            <div class="score-display" id="score6">0</div>
            <div class="buttons">
                <button class="btn btn-add" onclick="updateScore(6, 1)">+1 分</button>
                <button class="btn btn-subtract" onclick="updateScore(6, -1)">-1 分</button>
            </div>
        </div>
    </div>

    <script>
        let scores = [0, 0, 0, 0, 0, 0];

        function updateScore(group, change) {
            scores[group - 1] += change;
            if (scores[group - 1] < 0) {
                scores[group - 1] = 0;
            }
            
            document.getElementById(`score${group}`).textContent = scores[group - 1];
            updateHighest();
        }

        function updateHighest() {
            const maxScore = Math.max(...scores);
            
            for (let i = 1; i <= 6; i++) {
                const scoreElement = document.getElementById(`score${i}`);
                if (scores[i - 1] === maxScore && maxScore > 0) {
                    scoreElement.classList.add('highest');
                } else {
                    scoreElement.classList.remove('highest');
                }
            }
        }

        function resetAll() {
            if (confirm('確定要重置所有分數嗎？')) {
                scores = [0, 0, 0, 0, 0, 0];
                for (let i = 1; i <= 6; i++) {
                    document.getElementById(`score${i}`).textContent = '0';
                    document.getElementById(`score${i}`).classList.remove('highest');
                }
            }
        }

        function rewardAll() {
            for (let i = 0; i < 6; i++) {
                scores[i] += 1;
                document.getElementById(`score${i + 1}`).textContent = scores[i];
            }
            updateHighest();
        }

        updateHighest();
    </script>
</body>
</html>
